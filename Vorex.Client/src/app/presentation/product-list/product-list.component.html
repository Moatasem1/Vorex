<div class="product-list container px-4 mx-auto">
  <header class="bg-gray-200 p-4 mb-5 mt-5 rounded-t-md flex items-center justify-between">
    <h1 class="text-3xl">Product List</h1>
    <button type="button"
      class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5  dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Default</button>
  </header>

  @for (product of products; track product.id) {
  <div class="product-item">
    <h3>{{ product.name }}</h3>
    <p>{{ product.description }}</p>
    <p><strong>{{ product.price | currency }}</strong></p>
  </div>
  }
</div>
