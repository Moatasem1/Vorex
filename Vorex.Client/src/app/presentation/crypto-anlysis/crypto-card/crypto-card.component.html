<div (mouseenter)="toggleHovered()" (mouseleave)="toggleHovered()"
  class="group p-4 bg-white rounded-lg shadow-sm border border-purple-400 text-center hover:text-purple-600 hover:scale-105 hover:shadow-lg transition cursor-pointer"
  [ngClass]="{'shadow-xl border-2': isHovered}">
  <h3 class="mb-2 font-semibold">{{ crypto().name }}</h3>
  <p class="text-gray-500 bg-gray-100 rounded-lg p-2 inline text-xs">{{ crypto().symbol }}
  </p>
  <footer class="opacity-0 overflow-hidden transition-all duration-300 ease-in-out"
    [ngClass]="{'opacity-100 mt-5': isHovered}" [style]="{'max-height': isHovered ? '200px' : '0'}">
    <button (click)="emitAnalyzeRisk()" type="button" class="btn btn--sm btn-primary mb-2 w-full">analyze
      risk</button>
    <button (click)="emitHistoricalData()" type="button" class="btn btn--sm btn-primary-outline w-full">historical
      data</button>
  </footer>
</div>
