<app-popup [preventClose]="isAnalyzingRiskLoading()" #anylysisRiskModal [title]="'Analyze Risk for ' + crypto().name">
  <form [formGroup]="riskForm">
    <!-- amount controller -->
    <div class="mb-5">
      <label for="amount" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Enter the Amount to
        Invest
        ($):</label>
      <input [ngModel]="riskForm.value.amount || ''" formControlName="amount" type="number" id="amount"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-sm focus:ring-purple-500 focus:border-purple-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-purple-500 dark:focus:border-purple-500"
        placeholder="00.00$" required />
    </div>
