<section class="min-h-dvh flex items-center bg-purple-50/50">
  <form [formGroup]="loginForm" class="w-full p-4 md:p-8">
    <header class="mb-8">
      <div class="p-2 rounded-lg bg-gradient-to-r from-purple-600 to-blue-500 w-fit mb-2">
        <lucide-icon [img]="TrendingUp" class="my-icon text-white"></lucide-icon>
      </div>
      <h1 class="text-3xl font-medium text-purple-800 mb-2">Join Vorex</h1>
      <p class="text-sm text-gray-500">welcome back, login to your account</p>
    </header>
    <div class="mb-4">
      <label for="email">email</label>
      <input id="email" formControlName="email" type="email" class="text-sm w-full" placeholder="moatasem@example.com">
    </div>
    <div class="mb-4 w-full">
      <label for="password">password</label>
      <input id="password" formControlName="password" type="password" class="text-sm w-full"
        placeholder="minmum 6 characters">
    </div>

    @if(errorMessage()){
    <div class="text-sm text-red-600 p-2 bg-red-100 rounded text-center">{{errorMessage()}}</div>
    }

    <!-- {{createAccountForm.value | json}} -->
    <span class="text-sm text-gray-500 cursor-pointer">don't have an account? <a routerLink="/auth/signup"
        class="text-purple-600 hover:underline">create one</a></span>
    <button (click)="login()" [disabled]="!loginForm.valid"
      class="btn btn--md btn-primary w-full mt-6 flex items-center gap-2">
      @if(isLoginRequestLoading()){
      <app-loader [size]="'sm'"></app-loader>
      }
      <span>login</span>
    </button>
  </form>
  <div class="w-full h-dvh bg-cover bg-no-repeat bg-center hidden md:block"
    [style.backgroundImage]="'url(' + coverImages[currentCoverImageIndex].url+')'"></div>
</section>
