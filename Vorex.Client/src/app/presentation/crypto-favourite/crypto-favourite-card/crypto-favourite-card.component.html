<div class="relative shadow p-4 bg-white rounded-lg border border-gray-200">
  <h5 class="font-semibold text-lg mb-2">{{crypto().name}}</h5>
  <p class="text-gray-600 text-xs bg-gray-100 rounded-lg p-2 w-fit">{{crypto().symbol}}</p>
  <button (click)="emitCryptoDeleted()"
    class="flex items-center w-6 h-6 justify-center p-1 rounded-full absolute top-2 right-2 hover:text-red-500 hover:bg-red-50 hover:scale-110 focus:bg-red-100 transition cursor-pointer">
    <lucide-angular [img]="X" [size]="18" class=""></lucide-angular>
  </button>
</div>
