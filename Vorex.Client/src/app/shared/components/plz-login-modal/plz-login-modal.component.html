<app-popup [title]="'Please login'">
  <div class="mx-auto mb-4 w-18 h-18 bg-orange-100 rounded-full flex items-center justify-center">
    <lucide-angular [img]="CircleAlert" [size]="40" class="text-orange-600"></lucide-angular>
  </div>
  <h2 class="font-semibold text-xl  text-center capitalize text-orange-600"> {{message()}}</h2>
  <button type="button" class="btn btn--md btn-primary w-full mt-8" (click)="modal.hide();"
    routerLink="/auth/login">Login</button>
</app-popup>
